services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: migrate
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: pokehub-api
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    image: pokehub-ui
    ports:
      - "4000:3000"
    env_file: .env
    environment:
      BACKEND_URL: http://api:3000
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
