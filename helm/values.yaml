api:
  image:
    repository: ghcr.io/afod3v/pokehub-api
    tag: "a8706085"
    pullPolicy: Always
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  port: 3000
ui:
  image:
    repository: ghcr.io/afod3v/pokehub-ui
    tag: "a8706085"
    pullPolicy: Always
  replicas: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "250m"
  port: 4000
postgres:
  image: postgres:16-alpine
  database: pokehub
  user: pokehub
  storage: 5Gi
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"
redis:
  image: redis:7-alpine
  storage: 1Gi
  resources:
    requests:
      memory: "32Mi"
      cpu: "50m"
    limits:
      memory: "64Mi"
      cpu: "100m"
ingress:
  enabled: true
  # No domain yet — Traefik will serve on the VPS IP
  # When you get a domain, set this:
  # host: pokehub.yourdomain.com
imagePullSecrets:
  - name: ghcr-secret
