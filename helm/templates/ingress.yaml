# helm/templates/ingress.yaml
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pokehub-ingress
  namespace: pokehub
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - http:
      paths:
      # All traffic goes to SvelteKit UI.
      # SvelteKit handles /auth/* pages via SSR and calls the API
      # internally via api-svc ClusterIP — never directly from the browser.
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ui-svc
            port:
              number: 4000
{{- end }}
