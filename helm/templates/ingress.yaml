# helm/templates/ingress.yaml
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pokehub-ingress
  namespace: pokehub
  annotations:
    # Tell Traefik to use its default entrypoint
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - http:
      paths:
      # API routes
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-svc
            port:
              number: 3000
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: api-svc
            port:
              number: 3000
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: api-svc
            port:
              number: 3000
      # Everything else goes to the UI
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ui-svc
            port:
              number: 4000
{{- end }}